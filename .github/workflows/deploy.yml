
name: Deploy KelolaUsaha to VPS

on:
  push:
    branches:
       - wijaya-abadi
  workflow_dispatch:
    inputs:
      action:
        description: Run deployment or inspect tenant TLS configuration
        required: true
        type: choice
        options:
          - deploy
          - inspect_tls
          - setup_tenant_tls
          - show_tenant_tls_challenge
        default: deploy

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest

    steps:
      - name: Inspect tenant TLS configuration
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'inspect_tls' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -eu
            echo "=== NGINX TLS VHOSTS ==="
            if command -v nginx >/dev/null 2>&1; then
              sudo nginx -T 2>/dev/null | grep -B 5 -A 25 -F 'server_name kelolausaha.store' || true
            else
              echo "nginx is not installed"
            fi
            echo "=== CERTBOT CERTIFICATES ==="
            if command -v certbot >/dev/null 2>&1; then
              sudo certbot certificates 2>&1 | grep -A 5 -F 'Certificate Name: kelolausaha.store' || true
            else
              echo "certbot is not installed"
            fi
      - name: Set up isolated tenant wildcard TLS
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'setup_tenant_tls' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 1m
          command_timeout: 25m
          script: |
            set -eu

            CERT_NAME=kelolausaha-tenant-wildcard
            CERT_DIR="/etc/letsencrypt/live/$CERT_NAME"
            HOOK=/usr/local/sbin/kelolausaha-tenant-wildcard-auth-v1.py
            CHALLENGE_FILE=/run/kelolausaha-tenant-tls/dns-challenge.txt
            CONFIG=/etc/nginx/sites-available/kelolausaha-tenant-wildcard
            ENABLED=/etc/nginx/sites-enabled/kelolausaha-tenant-wildcard

            if ! command -v certbot >/dev/null 2>&1 || ! command -v nginx >/dev/null 2>&1; then
              echo "Certbot and Nginx must both be installed; no changes were made."
              exit 1
            fi
            if [ ! -f /var/www/kelolausaha.store/dist/index.html ]; then
              echo "KelolaUsaha frontend build was not found; no changes were made."
              exit 1
            fi
            if [ -e "$ENABLED" ] || [ -L "$ENABLED" ]; then
              echo "The dedicated tenant vhost path already exists; refusing to replace it."
              exit 1
            fi
            if [ -e "$CONFIG" ]; then
              echo "The dedicated tenant config path already exists; refusing to replace it."
              exit 1
            fi
            if [ -e "$HOOK" ] && ! sudo grep -q 'KelolaUsaha tenant wildcard DNS hook' "$HOOK"; then
              echo "The DNS hook path is already used by another file; refusing to replace it."
              exit 1
            fi

            if [ ! -e "$HOOK" ]; then
              sudo tee "$HOOK" >/dev/null <<'PY'
            #!/usr/bin/env python3
            # KelolaUsaha tenant wildcard DNS hook
            import json
            import os
            from pathlib import Path
            import time
            import urllib.error
            import urllib.parse
            import urllib.request

            domain = os.environ["CERTBOT_DOMAIN"].lstrip("*.")
            token = os.environ["CERTBOT_VALIDATION"]
            record = f"_acme-challenge.{domain}"
            query = urllib.parse.urlencode({"name": record, "type": "TXT"})
            url = f"https://dns.google/resolve?{query}"
            challenge_file = Path("/run/kelolausaha-tenant-tls/dns-challenge.txt")
            challenge_file.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
            challenge_file.write_text(
                f"Type: TXT\nName/Host: _acme-challenge\nFQDN: {record}\n"
                f"Value: {token}\nTTL: 300 (or the lowest available)\n",
                encoding="utf-8",
            )
            challenge_file.chmod(0o600)

            print("Add this temporary DNS record at Rumahweb, then leave it in place until issuance completes:", flush=True)
            print(f"Type: TXT\nName/Host: _acme-challenge\nFQDN: {record}\nValue: {token}\nTTL: 300 (or the lowest available)", flush=True)

            for attempt in range(120):
                try:
                    request = urllib.request.Request(url, headers={"Accept": "application/dns-json"})
                    with urllib.request.urlopen(request, timeout=10) as response:
                        result = json.load(response)
                    values = [
                        answer.get("data", "").strip('"')
                        for answer in result.get("Answer", [])
                        if answer.get("type") == 16
                    ]
                    if token in values:
                        print("The DNS TXT record is visible; continuing certificate issuance.", flush=True)
                        time.sleep(20)
                        raise SystemExit(0)
                except (urllib.error.URLError, TimeoutError, json.JSONDecodeError) as error:
                    if attempt == 0 or attempt % 12 == 0:
                        print(f"Waiting for DNS propagation ({type(error).__name__}).", flush=True)
                time.sleep(10)

            raise SystemExit("DNS TXT record was not detected within 20 minutes.")
            PY
              sudo chmod 755 "$HOOK"
            fi

            if [ ! -s "$CERT_DIR/fullchain.pem" ] || [ ! -s "$CERT_DIR/privkey.pem" ]; then
              sudo certbot certonly \
                --manual \
                --preferred-challenges dns \
                --manual-auth-hook "$HOOK" \
                --cert-name "$CERT_NAME" \
                --domains '*.kelolausaha.store' \
                --agree-tos \
                --register-unsafely-without-email \
                --non-interactive \
                --manual-public-ip-logging-ok
            fi

            if sudo test -f "$CHALLENGE_FILE"; then
              sudo rm "$CHALLENGE_FILE"
            fi
            sudo tee "$CONFIG" >/dev/null <<'NGINX'
            # KelolaUsaha tenant wildcard only; does not change other vhosts.
            server {
                listen 80;
                listen [::]:80;
                server_name *.kelolausaha.store;
                return 301 https://$host$request_uri;
            }

            server {
                listen 443 ssl;
                listen [::]:443 ssl;
                server_name *.kelolausaha.store;

                root /var/www/kelolausaha.store/dist;
                index index.html;
                client_max_body_size 20m;

                ssl_certificate /etc/letsencrypt/live/kelolausaha-tenant-wildcard/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/kelolausaha-tenant-wildcard/privkey.pem;

                # KelolaUsaha Socket.IO websocket endpoint
                location ^~ /api/socket.io/ {
                    proxy_pass http://127.0.0.1:4000;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_read_timeout 120s;
                }

                location = /api {
                    proxy_pass http://127.0.0.1:4000;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }

                location ^~ /api/ {
                    proxy_pass http://127.0.0.1:4000;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }

                location ^~ /uploads/ {
                    proxy_pass http://127.0.0.1:4000;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }

                location / {
                    try_files $uri $uri/ /index.html;
                }
            }
            NGINX
            sudo ln -s "$CONFIG" "$ENABLED"
            if ! sudo nginx -t; then
              sudo rm "$ENABLED" "$CONFIG"
              echo "Nginx validation failed; tenant-only config was removed and no reload was done."
              exit 1
            fi
            sudo systemctl reload nginx
            echo "Tenant wildcard TLS is active; existing website vhosts were not modified."
      - name: Show pending tenant DNS challenge
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'show_tenant_tls_challenge' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -eu
            CHALLENGE_FILE=/run/kelolausaha-tenant-tls/dns-challenge.txt
            if sudo test -s "$CHALLENGE_FILE"; then
              sudo cat "$CHALLENGE_FILE"
              exit 0
            fi
            sudo python3 - <<'PY'
            from pathlib import Path

            hook = "/usr/local/sbin/kelolausaha-tenant-wildcard-auth-v1.py"
            for process in Path("/proc").glob("[0-9]*"):
                try:
                    command = (process / "cmdline").read_bytes().replace(b"\0", b" ").decode()
                    if hook not in command:
                        continue
                    entries = (process / "environ").read_bytes().split(b"\0")
                    environment = {
                        key.decode(): value.decode()
                        for entry in entries if b"=" in entry
                        for key, value in [entry.split(b"=", 1)]
                    }
                    domain = environment.get("CERTBOT_DOMAIN", "").lstrip("*.")
                    token = environment.get("CERTBOT_VALIDATION")
                    if token:
                        print("Type: TXT")
                        print("Name/Host: _acme-challenge")
                        print(f"FQDN: _acme-challenge.{domain}")
                        print(f"Value: {token}")
                        print("TTL: 300 (or the lowest available)")
                        raise SystemExit(0)
                except (OSError, UnicodeDecodeError, PermissionError):
                    continue
            raise SystemExit("No tenant DNS challenge is currently pending.")
            PY
      - name: Deploy through SSH
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.action == 'deploy' }}
        uses: appleboy/ssh-action@v1.2.0
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          API_PORT: ${{ secrets.API_PORT }}
          APP_ORIGIN: ${{ secrets.APP_ORIGIN }}
          PLATFORM_OWNER_EMAIL: ${{ secrets.PLATFORM_OWNER_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER || secrets.IMAP_USER || secrets.SMTP_FROM }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_SECURE: ${{ secrets.IMAP_SECURE }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          MIDTRANS_ENV: ${{ secrets.MIDTRANS_ENV }}
          MIDTRANS_SERVER_KEY: ${{ secrets.MIDTRANS_SERVER_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: DATABASE_URL,SESSION_SECRET,API_PORT,APP_ORIGIN,PLATFORM_OWNER_EMAIL,SMTP_HOST,SMTP_PORT,SMTP_SECURE,SMTP_USER,SMTP_PASSWORD,SMTP_FROM,IMAP_HOST,IMAP_PORT,IMAP_SECURE,IMAP_USER,IMAP_PASSWORD,MIDTRANS_ENV,MIDTRANS_SERVER_KEY
          script: |
            set -e
            cd /var/www/kelolausaha.store

            echo "Updating application code..."
            git fetch origin wijaya-abadi
            git reset --hard origin/wijaya-abadi

            echo "Updating application secrets..."
            python3 - <<'PY'
            from pathlib import Path
            import os
            import json

            keys = [
                "DATABASE_URL", "SESSION_SECRET", "API_PORT",
                "APP_ORIGIN", "PLATFORM_OWNER_EMAIL",
                "SMTP_HOST", "SMTP_PORT", "SMTP_SECURE",
                "SMTP_USER", "SMTP_PASSWORD", "SMTP_FROM",
                "IMAP_HOST", "IMAP_PORT", "IMAP_SECURE",
                "IMAP_USER", "IMAP_PASSWORD",
                "MIDTRANS_ENV", "MIDTRANS_SERVER_KEY",
            ]

            path = Path(".env")
            lines = path.read_text().splitlines() if path.exists() else []

            for key in keys:
                value = os.environ.get(key, "")
                if value == "":
                    continue

                new_line = f"{key}={json.dumps(value)}"
                prefix = key + "="
                for index, line in enumerate(lines):
                    if line.startswith(prefix):
                        lines[index] = new_line
                        break
                else:
                    lines.append(new_line)

            path.write_text("\n".join(lines) + "\n")
            path.chmod(0o600)
            PY

            echo "Installing dependencies..."
            npm ci

            echo "Verifying SMTP connection..."
            node --input-type=module <<'JS'
            import 'dotenv/config';
            import nodemailer from 'nodemailer';

            const user = process.env.SMTP_USER || process.env.IMAP_USER || process.env.SMTP_FROM;
            if (!process.env.SMTP_HOST || !user || !process.env.SMTP_PASSWORD) {
              console.error('SMTP settings are incomplete. Check SMTP_HOST, username, and SMTP_PASSWORD.');
              process.exit(1);
            }

            const transport = nodemailer.createTransport({
              host: process.env.SMTP_HOST,
              port: Number(process.env.SMTP_PORT) || 587,
              secure: process.env.SMTP_SECURE === 'true',
              auth: { user, pass: process.env.SMTP_PASSWORD },
            });

            try {
              await transport.verify();
              console.log('SMTP connection verified.');
            } catch (error) {
              const code = error?.code || 'unknown';
              const responseCode = Number.isInteger(error?.responseCode) ? `, SMTP ${error.responseCode}` : '';
              console.error(`SMTP verification failed (${code}${responseCode}). Check host, port, TLS, username, and password settings.`);
              process.exitCode = 1;
            } finally {
              transport.close();
            }
            JS

            echo "Verifying Gmail IMAP connection..."
            node --input-type=module <<'JS'
            import 'dotenv/config';
            import { ImapFlow } from 'imapflow';

            const user = process.env.IMAP_USER || process.env.SMTP_USER || process.env.SMTP_FROM;
            const password = process.env.IMAP_PASSWORD || process.env.SMTP_PASSWORD;
            if (!user || !password) {
              console.error('IMAP settings are incomplete. Check IMAP_USER and IMAP_PASSWORD.');
              process.exit(1);
            }

            const client = new ImapFlow({
              host: process.env.IMAP_HOST || 'imap.gmail.com',
              port: Number(process.env.IMAP_PORT) || 993,
              secure: process.env.IMAP_SECURE !== 'false',
              auth: { user, pass: password },
              logger: false,
            });

            try {
              await client.connect();
              const mailboxes = await client.list();
              const hasInbox = mailboxes.some(({ path }) => path.toUpperCase() === 'INBOX');
              const hasSent = mailboxes.some(({ path, specialUse }) => (
                specialUse?.toLowerCase() === '\\sent' || /\bsent\b/i.test(path)
              ));
              if (!hasInbox || !hasSent) {
                throw new Error('Gmail INBOX or Sent folder is unavailable.');
              }
              console.log('Gmail IMAP connection verified; INBOX and Sent folders are available.');
            } catch (error) {
              const code = error?.code || 'unknown';
              console.error(`IMAP verification failed (${code}). Check Gmail IMAP access, App Password, host, port, and TLS settings.`);
              process.exitCode = 1;
            } finally {
              if (client.usable) await client.logout();
            }
            JS

            echo "Running database migrations..."
            npm run db:migrate

            echo "Building frontend..."
            npm run build

            echo "Configuring the Socket.IO reverse proxy..."
            sudo python3 - <<'PY'
            from pathlib import Path
            import subprocess

            socket_location = """    # KelolaUsaha Socket.IO websocket endpoint
                location ^~ /api/socket.io/ {
                    proxy_pass http://127.0.0.1:4000;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_read_timeout 120s;
                }

            """
            configurations = [
                (Path("/etc/nginx/sites-available/kelolausaha.store"), "    # Backend API\n", True),
                (
                    Path("/etc/nginx/sites-available/kelolausaha-tenant-wildcard"),
                    "                location = /api {\n",
                    False,
                ),
            ]
            changed = []
            marker = "# KelolaUsaha Socket.IO websocket endpoint"

            for path, anchor, required in configurations:
                if not path.exists():
                    if required:
                        raise SystemExit(f"Required Nginx vhost not found: {path}")
                    continue
                original = path.read_text()
                if marker in original or "location ^~ /api/socket.io/" in original:
                    continue
                if not required and "# KelolaUsaha tenant wildcard only; does not change other vhosts." not in original:
                    continue
                if original.count(anchor) != 1:
                    if required:
                        raise SystemExit(f"Expected Nginx insertion point not found in {path}")
                    continue
                backup = path.with_name(path.name + ".support-socket.bak")
                if backup.exists():
                    raise SystemExit(f"Refusing to overwrite existing backup: {backup}")
                backup.write_text(original)
                path.write_text(original.replace(anchor, socket_location + anchor, 1))
                changed.append((path, backup, original))

            if changed:
                try:
                    subprocess.run(["nginx", "-t"], check=True)
                    subprocess.run(["systemctl", "reload", "nginx"], check=True)
                except Exception:
                    for path, backup, original in changed:
                        path.write_text(original)
                        backup.unlink()
                    raise
                for _, backup, _ in changed:
                    backup.unlink()
                print("Socket.IO websocket proxy configured.")
            else:
                print("Socket.IO websocket proxy already configured.")
            PY

            echo "Restarting backend..."
            systemctl restart kelolausaha

            echo "Verifying realtime support chat..."
            node --input-type=module <<'JS'
            import { io } from 'socket.io-client';

            const socket = io('http://127.0.0.1:4000', {
              path: '/api/socket.io',
              transports: ['websocket'],
              timeout: 10000,
            });

            try {
              await new Promise((resolve, reject) => {
                const timeout = setTimeout(() => reject(new Error('Socket.IO connection timed out.')), 12000);
                socket.once('connect', () => {
                  clearTimeout(timeout);
                  resolve();
                });
                socket.once('connect_error', (error) => {
                  clearTimeout(timeout);
                  reject(error);
                });
              });
              console.log('Socket.IO websocket connection to the API verified.');
            } catch (error) {
              console.error(`Socket.IO verification failed: ${error.message}`);
              process.exitCode = 1;
            } finally {
              socket.disconnect();
            }
            JS

            echo "Deployment completed."
